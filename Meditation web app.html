<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meditation Web App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f0f4f8;
      color: #333;
    }

    /* Navbar */
    header {
      background: #4a90e2;
      padding: 15px;
      color: white;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }

    /* Sections */
    section {
      padding: 50px;
      text-align: center;
    }
    section:nth-child(even) {
      background: #fff;
    }
    section:nth-child(odd) {
      background: #e9f2fb;
    }

    h1, h2 {
      color: #2c3e50;
    }

    /* Contact Form */
    form {
      max-width: 500px;
      margin: 0 auto;
      text-align: left;
    }
    label {
      display: block;
      margin: 10px 0 5px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: #4a90e2;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #357abd;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #4a90e2;
      color: white;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <header>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About Us</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- Home Section -->
  <section id="home">
    <h1>Welcome to Meditation App</h1>
    <p>Find peace and calm with guided meditation and breathing exercises.</p>
  </section>

  <!-- About Section -->
  <section id="about">
    <h2>About Us</h2>
    <p>We are dedicated to helping people reduce stress and improve their wellbeing through mindfulness practices.</p>
  </section>

  <!-- Contact Section -->
  <section id="contact">
    <h2>Contact Us</h2>
    <form id="contactForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" required />

      <label for="email">Email</label>
      <input type="email" id="email" required />

      <label for="message">Message</label>
      <textarea id="message" rows="5" required></textarea>

      <button type="submit">Send</button>
    </form>
    <p id="status"></p>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2025 Meditation App. All rights reserved.</p>
  </footer>

  <script>
    // Contact form validation
    const form = document.getElementById("contactForm");
    const status = document.getElementById("status");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      status.textContent = "Message sent successfully! (Demo only)";
      form.reset();
    });
  </script>
</body>
</html>

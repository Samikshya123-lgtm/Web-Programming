<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sample Product Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <div class="row">
    <div class="col-md-4 mb-4">
      <div class="card h-100">
        <img src="images/chocolate-cake.jpg" class="card-img-top" alt="Chocolate Fudge Cake">
        <div class="card-body">
          <h5 class="card-title">Chocolate Fudge Cake</h5>
          <p class="card-text">Rs. 450</p>
          <a href="product1.html" class="btn btn-primary">View Details</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

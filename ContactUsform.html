<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .contact-form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .radio-group {
            margin-top: 5px;
        }
        .radio-group label {
            font-weight: normal;
            margin-right: 15px;
        }
        button {
            margin-top: 15px;
            background: #28a745;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>

    <form class="contact-form" action="#" method="POST">
        <h2>Contact Us</h2>
        
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
        
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        
        <label>Inquiry Type:</label>
        <div class="radio-group">
            <input type="radio" id="general" name="inquiry" value="General Inquiry" required>
            <label for="general">General Inquiry</label>
            
            <input type="radio" id="support" name="inquiry" value="Support">
            <label for="support">Support</label>
            
            <input type="radio" id="feedback" name="inquiry" value="Feedback">
            <label for="feedback">Feedback</label>
        </div>
        
        <label for="message">Your Message:</label>
        <textarea id="message" name="message" rows="4" placeholder="Type your message..." required></textarea>
        
        <button type="submit">Send Message</button>
    </form>

</body>
</html>

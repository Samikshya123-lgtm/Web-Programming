<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bakery Registration Form</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Header / Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">SweetCrumb Bakery</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
        <li class="nav-item"><a class="nav-link active" href="#">Register</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Registration Form -->
<div class="container mt-5">
  <h2 class="text-center mb-4">Register for SweetCrumb Bakery</h2>
  <form class="border p-4 rounded shadow bg-light">
    <div class="mb-3">
      <label for="name" class="form-label">Full Name</label>
      <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
    </div>
    
    <div class="mb-3">
      <label for="email" class="form-label">Email address</label>
      <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
    </div>
    
    <div class="mb-3">
      <label for="phone" class="form-label">Phone Number</label>
      <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number" required>
    </div>
    
    <div class="mb-3">
      <label for="address" class="form-label">Address</label>
      <textarea class="form-control" id="address" rows="3" placeholder="Enter your delivery address" required></textarea>
    </div>
    
    <div class="mb-3">
      <label for="favorite" class="form-label">Favorite Bakery Product</label>
      <select class="form-select" id="favorite">
        <option selected disabled>Choose your favorite</option>
        <option>Cakes</option>
        <option>Pastries</option>
        <option>Breads</option>
        <option>Cookies</option>
        <option>Muffins</option>
      </select>
    </div>
    
    <div class="mb-3">
      <label class="form-label">Membership Type</label><br>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="membership" id="basic" value="Basic">
        <label class="form-check-label" for="basic">Basic</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="membership" id="premium" value="Premium">
        <label class="form-check-label" for="premium">Premium</label>
      </div>
    </div>
    
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="terms" required>
      <label class="form-check-label" for="terms">I agree to the terms and conditions</label>
    </div>
    
    <button type="submit" class="btn btn-primary w-100">Register</button>
  </form>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3 mt-5">
  <p class="mb-0">© 2025 SweetCrumb Bakery | Designed with Bootstrap</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
